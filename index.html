<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarXPlay</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .logo { font-size: 18px; font-weight: bold; color: #70a1ff; display: flex; align-items: center; gap: 5px; }
        .balance-box { background: #1e272e; padding: 8px 15px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 5px; border: 1px solid #3d3d3d; }
        
        .game-container { width: 100%; max-width: 400px; background: #1e272e; border-radius: 15px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); position: relative; margin-bottom: 20px; border: 1px solid #2f3640; }
        .game-screen { height: 200px; background: #0f131a; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; margin-bottom: 15px; border: 1px solid #353b48; }
        .multiplier { font-size: 42px; font-weight: bold; color: #ff4757; }
        .crash-label { font-size: 14px; color: #ff4757; letter-spacing: 2px; margin-top: 5px; }
        
        .control-panel { display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; justify-content: space-between; align-items: center; background: #0f131a; padding: 10px 15px; border-radius: 10px; border: 1px solid #353b48; }
        .input-group span { color: #a4b0be; font-size: 14px; }
        .stake-input { background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; width: 80px; text-align: right; outline: none; }
        
        .quick-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .q-btn { background: #2f3640; border: none; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .q-btn:active { background: #70a1ff; }
        
        .action-btn { width: 100%; background: linear-gradient(135deg, #70a1ff, #3742fa); border: none; color: #white; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: #fff; }
        .action-btn:active { transform: scale(0.98); }
        .action-btn.cashout { background: linear-gradient(135deg, #2ed573, #26af5f); }

        /* Экраны результатов (Победа / Поражение) */
        .result-card { background: #0f131a; border-radius: 12px; padding: 20px; border: 1px solid #353b48; margin-top: 10px; }
        .result-details { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-top: 15px; }
        
        /* Блок промокодов */
        .promo-section { width: 100%; max-width: 400px; background: #1e272e; border-radius: 15px; padding: 15px; border: 1px solid #2f3640; display: flex; gap: 10px; }
        .promo-input { flex: 1; background: #0f131a; border: 1px solid #353b48; border-radius: 10px; padding: 10px 12px; color: #fff; outline: none; }
        .promo-btn { background: #ffa502; border: none; padding: 0 15px; border-radius: 10px; font-weight: bold; color: #000; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🚀 STARXPLAY</div>
        <div class="balance-box">
            <span>⭐</span>
            <span id="balanceVal">1000</span>
        </div>
    </div>

    <div class="game-container">
        <div class="game-screen" id="gameScreen">
            <div class="multiplier" id="multiplier">1.00x</div>
            <div class="crash-label" id="statusLabel">РАУНД ГОТОВ</div>
        </div>

        <!-- Панель ставок -->
        <div class="control-panel" id="controlPanel">
            <div class="input-group">
                <span>Сумма ставки</span>
                <div>
                    <input type="number" id="stakeInput" class="stake-input" value="100">
                    <span style="color: #ffa502;">⭐</span>
                </div>
            </div>
            
            <div class="quick-buttons">
                <button class="q-btn" onclick="addStake(10)">+10</button>
                <button class="q-btn" onclick="addStake(50)">+50</button>
                <button class="q-btn" onclick="addStake(100)">+100</button>
                <button class="q-btn" onclick="setMax()">MAX</button>
            </div>

            <button class="action-btn" id="actionBtn" onclick="startGame()">СДЕЛАТЬ СТАВКУ</button>
        </div>

        <!-- Блок победы -->
        <div id="win-result-card" class="result-card" style="display: none;">
            <h3 style="color: #2ed573; text-align: center; margin-bottom: 10px;">ПОБЕДА!</h3>
            <div style="text-align: center; font-size: 32px; font-weight: bold; color: #2ed573; margin-bottom: 15px;" id="winAmount">0 ⭐</div>
            <div class="result-details">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;"><span style="color: #a4b0be;">Коэффициент</span><span id="winCoeff">1.00x</span></div>
                <div style="display: flex; justify-content: space-between;"><span style="color: #a4b0be;">Ваша ставка</span><span id="winStake">0 ⭐</span></div>
            </div>
            <button class="action-btn" style="margin-top: 15px;" onclick="resetGameScreen()">НОВЫЙ РАУНД</button>
        </div>

        <!-- Блок поражения -->
        <div id="defeat-result-card" class="result-card" style="display: none;">
            <h3 style="color: #ff4757; text-align: center; margin-bottom: 10px;">ПОРАЖЕНИЕ</h3>
            <div style="text-align: center; font-size: 32px; font-weight: bold; color: #ff4757; margin-bottom: 15px;" id="defeatAmount">0 ⭐</div>
            <div class="result-details" style="background: rgba(255,71,87,0.05);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;"><span style="color: #a4b0be;">Краш на</span><span id="defeatCoeff">1.00x</span></div>
                <div style="display: flex; justify-content: space-between;"><span style="color: #a4b0be;">Сгорело</span><span id="defeatStake">0 ⭐</span></div>
            </div>
            <button class="action-btn" style="margin-top: 15px; background: linear-gradient(135deg, #ff4757, #ff6b81);" onclick="resetGameScreen()">НОВЫЙ РАУНД</button>
        </div>
    </div>

    <!-- Блок промокодов -->
    <div class="promo-section">
        <input type="text" id="promoInput" class="promo-input" placeholder="Введите промокод...">
        <button class="promo-btn" onclick="activatePromo()">ОК</button>
    </div>

    <script>
        let balance = 1000;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let isPlaying = false;
        let currentStake = 100;
        let crashAt = 1.50;

        function addStake(val) {
            let input = document.getElementById('stakeInput');
            let current = parseInt(input.value) || 0;
            input.value = current + val;
        }

        function setMax() {
            document.getElementById('stakeInput').value = balance;
        }

        function startGame() {
            currentStake = parseInt(document.getElementById('stakeInput').value);
            if (isNaN(currentStake) || currentStake <= 0) {
                alert("Введите корректную ставку!");
                return;
            }
            if (currentStake > balance) {
                alert("Недостаточно средств!");
                return;
            }

            balance -= currentStake;
            updateBalanceView();

            isPlaying = true;
            currentMultiplier = 1.00;
            crashAt = (Math.random() * 2 + 1.1).toFixed(2); // Рандомный краш

            document.getElementById('controlPanel').style.display = 'none';
            let btn = document.getElementById('actionBtn');
            btn.style.display = 'block';
            btn.className = "action-btn cashout";
            btn.innerText = "ЗАБРАТЬ";
            btn.onclick = cashOut;

            document.getElementById('statusLabel').innerText = "РАКЕТА ЛЕТИТ...";
            document.getElementById('statusLabel').style.color = "#2ed573";

            gameInterval = setInterval(() => {
                currentMultiplier = (parseFloat(currentMultiplier) + 0.03).toFixed(2);
                document.getElementById('multiplier').innerText = currentMultiplier + 'x';

                if (parseFloat(currentMultiplier) >= parseFloat(crashAt)) {
                    endGame(false); // Краш / Поражение
                }
            }, 100);
        }

        function cashOut() {
            if (!isPlaying) return;
            clearInterval(gameInterval);
            isPlaying = false;

            let winnings = Math.floor(currentStake * currentMultiplier);
            balance += winnings;
            updateBalanceView();

            // Показываем окно победы
            document.getElementById('controlPanel').style.display = 'none';
            document.getElementById('winAmount').innerText = winnings + " ⭐";
            document.getElementById('winCoeff').innerText = currentMultiplier + "x";
            document.getElementById('winStake').innerText = currentStake + " ⭐";
            document.getElementById('win-result-card').style.display = 'block';
            document.getElementById('statusLabel').innerText = "ВЫИГРЫШ ЗАБРАН";
            document.getElementById('statusLabel').style.color = "#2ed573";
        }

        function endGame(isWin) {
            clearInterval(gameInterval);
            isPlaying = false;

            if (isWin) {
                // Если как-то иначе завершилось победой
            } else {
                // Поражение (Краш)
                document.getElementById('controlPanel').style.display = 'none';
                document.getElementById('defeatAmount').innerText = currentStake + " ⭐";
                document.getElementById('defeatCoeff').innerText = crashAt + "x";
                document.getElementById('defeatStake').innerText = currentStake + " ⭐";
                document.getElementById('defeat-result-card').style.display = 'block';
                document.getElementById('statusLabel').innerText = "КРАШ 💥";
                document.getElementById('statusLabel').style.color = "#ff4757";
                document.getElementById('multiplier').innerText = crashAt + 'x';
            }
        }

        function resetGameScreen() {
            document.getElementById('win-result-card').style.display = 'none';
            document.getElementById('defeat-result-card').style.display = 'none';
            document.getElementById('controlPanel').style.display = 'flex';
            document.getElementById('multiplier').innerText = '1.00x';
            document.getElementById('statusLabel').innerText = 'РАУНД ГОТОВ';
            document.getElementById('statusLabel').style.color = '#a4b0be';
        }

        function updateBalanceView() {
            document.getElementById('balanceVal').innerText = balance;
        }

        function activatePromo() {
            let code = document.getElementById('promoInput').value.trim();
            if (code === "STAR2026") {
                balance += 500;
                updateBalanceView();
                alert("Промокод активирован! Начислено 500 ⭐");
                document.getElementById('promoInput').value = "";
            } else {
                alert("Неверный промокод!");
            }
        }
    </script>
</body>
</html>
