<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>StarXPlay</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: #070913;
            --card: rgba(23, 32, 55, 0.82);
            --card2: rgba(15, 23, 42, 0.92);

            --purple: #9333ea;
            --purple2: #6d28d9;
            --blue: #38bdf8;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #facc15;

            --text: #ffffff;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(68, 71, 150, 0.20),
                    transparent 45%
                ),
                #070913;

            color: white;

            display: flex;
            justify-content: center;

            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;

            padding: 12px;
            padding-bottom: 92px;

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        /* =========================
           HEADER
        ========================== */

        .top-header {
            min-height: 66px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 15px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 18px;

            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 18px;
            font-weight: 900;

            letter-spacing: 0.7px;

            background: linear-gradient(
                90deg,
                #38bdf8,
                #8b5cf6
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-box {
            display: flex;
            align-items: center;

            gap: 7px;

            padding: 7px 13px;

            border-radius: 999px;

            background: rgba(15, 23, 42, 0.9);

            border: 1px solid rgba(56, 189, 248, 0.30);

            color: var(--blue);

            font-size: 14px;
            font-weight: 900;
        }

        /* =========================
           HISTORY
        ========================== */

        .history-row {
            display: flex;

            gap: 7px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .history-row::-webkit-scrollbar {
            display: none;
        }

        .history-pill {
            flex-shrink: 0;

            padding: 5px 10px;

            border-radius: 9px;

            background: var(--card);

            border: 1px solid var(--border);

            font-size: 11px;
            font-weight: 900;
        }

        .history-pill.low {
            color: var(--yellow);
        }

        .history-pill.mid {
            color: var(--blue);
        }

        .history-pill.high {
            color: #c084fc;
        }

        .history-pill.ultra {
            color: var(--green);
        }

        /* =========================
           GAME CARD
        ========================== */

        .arena-card {
            padding: 12px;

            display: flex;
            flex-direction: column;

            gap: 12px;

            background: var(--card);

            border-radius: 20px;

            border: 1px solid var(--border);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .game-viewport {
            position: relative;

            height: 270px;

            overflow: hidden;

            border-radius: 16px;

            border: 1px solid rgba(56, 189, 248, 0.16);

            background:
                radial-gradient(
                    circle at 50% 50%,
                    #1e293b 0%,
                    #0b1220 55%,
                    #070b13 100%
                );
        }

        #gameCanvas {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 1;
        }

        /* =========================
           ROCKET
        ========================== */

        .rocket {
            position: absolute;

            left: 20px;
            bottom: 18px;

            z-index: 5;

            font-size: 40px;

            line-height: 1;

            transform-origin: center;

            will-change: transform;

            filter:
                drop-shadow(
                    0 0 6px rgba(56, 189, 248, 0.95)
                )
                drop-shadow(
                    0 0 14px rgba(147, 51, 234, 0.75)
                );
        }

        .rocket.flying {
            animation: rocketPulse 0.35s infinite alternate;
        }

        @keyframes rocketPulse {
            from {
                filter:
                    drop-shadow(
                        0 0 5px rgba(56, 189, 248, 0.8)
                    )
                    drop-shadow(
                        0 0 10px rgba(147, 51, 234, 0.6)
                    );
            }

            to {
                filter:
                    drop-shadow(
                        0 0 10px rgba(56, 189, 248, 1)
                    )
                    drop-shadow(
                        0 0 22px rgba(147, 51, 234, 1)
                    );
            }
        }

        /* =========================
           CENTER HUD
        ========================== */

        .center-hud {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;

            pointer-events: none;
        }

        .multiplier {
            font-size: 45px;
            font-weight: 950;

            letter-spacing: 0.5px;

            color: white;

            text-shadow:
                0 0 22px rgba(56, 189, 248, 0.55);
        }

        .status {
            margin-top: 3px;

            color: var(--muted);

            font-size: 12px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            text-align: center;
        }

        /* =========================
           CONTROLS
        ========================== */

        .control-panel {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .bet-box {
            min-height: 50px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 10px 14px;

            background: rgba(15, 23, 42, 0.93);

            border: 1px solid #334155;

            border-radius: 13px;
        }

        .bet-label {
            color: var(--muted);

            font-size: 13px;
            font-weight: 800;
        }

        .bet-input-wrap {
            display: flex;
            align-items: center;

            gap: 6px;
        }

        .bet-input {
            width: 100px;

            background: none;

            border: 0;
            outline: 0;

            text-align: right;

            color: white;

            font-size: 19px;
            font-weight: 950;
        }

        .quick-chips {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 7px;
        }

        .chip {
            padding: 9px 0;

            border: 1px solid #334155;
            border-radius: 9px;

            background: #1e293b;

            color: var(--muted);

            font-size: 12px;
            font-weight: 900;

            cursor: pointer;
        }

        .chip:active {
            transform: scale(0.96);
        }

        .main-btn {
            width: 100%;

            padding: 16px 10px;

            border: 0;

            border-radius: 14px;

            color: white;

            font-size: 16px;
            font-weight: 950;

            letter-spacing: 0.5px;

            cursor: pointer;

            text-transform: uppercase;
        }

        .main-btn:active {
            transform: scale(0.985);
        }

        .play-btn {
            background:
                linear-gradient(
                    135deg,
                    #a21caf,
                    #7c3aed,
                    #6d28d9
                );

            box-shadow:
                0 5px 22px rgba(147, 51, 234, 0.45);
        }

        .cash-btn {
            display: none;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            box-shadow:
                0 5px 22px rgba(34, 197, 94, 0.35);
        }

        /* =========================
           FEATURES
        ========================== */

        .features {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .feature {
            padding: 12px;

            display: flex;
            flex-direction: column;

            gap: 9px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .feature-title {
            color: var(--muted);

            font-size: 11px;
            font-weight: 900;
        }

        .feature-btn {
            padding: 9px;

            border: 0;
            border-radius: 9px;

            background: var(--purple);

            color: white;

            font-size: 12px;
            font-weight: 900;

            cursor: pointer;
        }

        .feature-btn.blue {
            background: #2563eb;
        }

        /* =========================
           BOTTOM NAV
        ========================== */

        .bottom-nav {
            position: fixed;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            width: 100%;
            max-width: 480px;

            padding: 10px 4px 12px;

            display: flex;
            justify-content: space-around;

            background: rgba(15, 23, 42, 0.96);

            border-top: 1px solid var(--border);

            backdrop-filter: blur(18px);

            z-index: 100;
        }

        .nav-item {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 3px;

            border: 0;

            background: none;

            color: var(--muted);

            font-size: 9px;
            font-weight: 800;
        }

        .nav-icon {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--blue);
        }
    </style>
</head>

<body>

<div class="wrapper">

    <!-- HEADER -->
    <header class="top-header">

        <div class="brand">
            🚀 STARXPLAY
        </div>

        <div class="balance-box">
            ⭐
            <span id="balanceVal">1500</span>
        </div>

    </header>


    <!-- HISTORY -->
    <div class="history-row" id="historyRow">

        <div class="history-pill low">1.12x</div>
        <div class="history-pill mid">2.34x</div>
        <div class="history-pill high">5.67x</div>
        <div class="history-pill ultra">12.4x</div>
        <div class="history-pill low">1.04x</div>

    </div>


    <!-- GAME -->
    <main class="arena-card">

        <div class="game-viewport" id="gameViewport">

            <canvas id="gameCanvas"></canvas>

            <div
                class="rocket"
                id="rocket"
            >
                🚀
            </div>

            <div class="center-hud">

                <div
                    class="multiplier"
                    id="multiplierView"
                >
                    1.00x
                </div>

                <div
                    class="status"
                    id="statusView"
                >
                    Готов к запуску
                </div>

            </div>

        </div>


        <!-- CONTROLS -->
        <div class="control-panel">

            <div class="bet-box">

                <span class="bet-label">
                    Сумма ставки:
                </span>

                <div class="bet-input-wrap">

                    <input
                        id="betField"
                        class="bet-input"
                        type="number"
                        min="1"
                        value="100"
                    >

                    <span>⭐</span>

                </div>

            </div>


            <div class="quick-chips">

                <button
                    class="chip"
                    onclick="modifyBet(10)"
                >
                    +10
                </button>

                <button
                    class="chip"
                    onclick="modifyBet(50)"
                >
                    +50
                </button>

                <button
                    class="chip"
                    onclick="modifyBet(100)"
                >
                    +100
                </button>

                <button
                    class="chip"
                    onclick="modifyBet(500)"
                >
                    +500
                </button>

            </div>


            <button
                class="main-btn play-btn"
                id="playBtn"
                onclick="startGame()"
            >
                Сделать ставку
            </button>


            <button
                class="main-btn cash-btn"
                id="cashBtn"
                onclick="cashOut()"
            >
                Забрать
                <span id="winPreview">0</span>
                ⭐
            </button>

        </div>

    </main>


    <!-- EXTRA -->
    <section class="features">

        <div class="feature">

            <div class="feature-title">
                🎁 ЕЖЕДНЕВНЫЙ БОНУС
            </div>

            <button
                class="feature-btn"
                onclick="claimBonus()"
            >
                Забрать
            </button>

        </div>


        <div class="feature">

            <div class="feature-title">
                👥 РЕФЕРАЛЫ
            </div>

            <button
                class="feature-btn blue"
                onclick="shareReferral()"
            >
                Пригласить
            </button>

        </div>

    </section>

</div>


<!-- NAVIGATION -->
<nav class="bottom-nav">

    <button class="nav-item active">
        <span class="nav-icon">🎮</span>
        Игра
    </button>

    <button
        class="nav-item"
        onclick="alert('Раздел бонусов в разработке')"
    >
        <span class="nav-icon">🎁</span>
        Бонусы
    </button>

    <button
        class="nav-item"
        onclick="alert('Реферальная система')"
    >
        <span class="nav-icon">🤝</span>
        Рефералы
    </button>

    <button
        class="nav-item"
        onclick="alert('Статистика игроков')"
    >
        <span class="nav-icon">📊</span>
        Статистика
    </button>

    <button
        class="nav-item"
        onclick="alert('Поддержка')"
        >
        <span class="nav-icon">💬</span>
        Саппорт
    </button>

</nav>


<script>

    /* ===================================
       TELEGRAM WEB APP
    ==================================== */

    try {

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            const tg = window.Telegram.WebApp;

            tg.ready();
            tg.expand();

        }

    } catch (error) {

        console.log(
            "Telegram WebApp unavailable",
            error
        );

    }


    /* ===================================
       ELEMENTS
    ==================================== */

    const balanceVal =
        document.getElementById(
            "balanceVal"
        );

    const multiplierView =
        document.getElementById(
            "multiplierView"
        );

    const statusView =
        document.getElementById(
            "statusView"
        );

    const rocket =
        document.getElementById(
            "rocket"
        );

    const betField =
        document.getElementById(
            "betField"
        );

    const playBtn =
        document.getElementById(
            "playBtn"
        );

    const cashBtn =
        document.getElementById(
            "cashBtn"
        );

    const winPreview =
        document.getElementById(
            "winPreview"
        );

    const historyRow =
        document.getElementById(
            "historyRow"
        );

    const gameViewport =
        document.getElementById(
            "gameViewport"
        );


    /* ===================================
       CANVAS
    ==================================== */

    const canvas =
        document.getElementById(
            "gameCanvas"
        );

    const ctx =
        canvas.getContext("2d");


    let canvasWidth = 0;
    let canvasHeight = 0;

    let stars = [];


    function resizeCanvas() {

        const rect =
            gameViewport.getBoundingClientRect();

        canvasWidth = rect.width;
        canvasHeight = rect.height;

        const ratio =
            window.devicePixelRatio || 1;

        canvas.width =
            canvasWidth * ratio;

        canvas.height =
            canvasHeight * ratio;

        canvas.style.width =
            canvasWidth + "px";

        canvas.style.height =
            canvasHeight + "px";

        ctx.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );

        createStars();

    }


    function createStars() {

        stars = [];

        for (
            let i = 0;
            i < 55;
            i++
        ) {

            stars.push({

                x:
                    Math.random() *
                    canvasWidth,

                y:
                    Math.random() *
                    canvasHeight,

                size:
                    Math.random() * 1.8
                    + 0.4,

                alpha:
                    Math.random() * 0.6
                    + 0.2

            });

        }

    }


    function drawStars() {

        for (
            const star of stars
        ) {

            ctx.fillStyle =
                rgba(255,255,255,${star.alpha});

            ctx.fillRect(
                star.x,
                star.y,
                star.size,
                star.size
            );

        }

    }


    /* ===================================
       GAME VARIABLES
    ==================================== */

    let userBalance = 1500;

    let activeBet = 0;

    let currentMultiplier = 1;

    let targetCrash = 1;

    let gameActive = false;

    let animationFrame = null;

    let startTime = 0;

    let previousRocketX = 20;
    let previousRocketY = 0;


    /* ===================================
       BET
    ==================================== */

    function modifyBet(amount) {

        if (gameActive) {
            return;
        }

        const current =
            Number(
                betField.value
            ) || 0;
        const newAmount =
            current + amount;

        betField.value =
            Math.min(
                newAmount,
                userBalance
            );

    }


    /* ===================================
       CRASH GENERATOR
    ==================================== */

    function generateCrashPoint() {

        const random =
            Math.random();

        /*
            Большинство игр заканчиваются
            между 1.2x и 4x.

            Иногда коэффициент выше.
        */

        if (random < 0.50) {

            return Number(
                (
                    1.20 +
                    Math.random() * 1.5
                ).toFixed(2)
            );

        }

        if (random < 0.85) {

            return Number(
                (
                    2.70 +
                    Math.random() * 3.3
                ).toFixed(2)
            );

        }

        return Number(
            (
                6 +
                Math.random() * 8
            ).toFixed(2)
        );

    }


    /* ===================================
       START GAME
    ==================================== */

    function startGame() {

        if (gameActive) {
            return;
        }


        const bet =
            Number(
                betField.value
            );


        if (
            !Number.isFinite(bet) ||
            bet <= 0
        ) {

            alert(
                "Введите корректную сумму ставки"
            );

            return;

        }


        if (
            bet > userBalance
        ) {

            alert(
                "Недостаточно звёзд"
            );

            return;

        }


        activeBet =
            Math.floor(bet);


        userBalance -=
            activeBet;


        balanceVal.textContent =
            userBalance;


        currentMultiplier =
            1;


        targetCrash =
            generateCrashPoint();


        gameActive =
            true;


        betField.disabled =
            true;


        playBtn.style.display =
            "none";


        cashBtn.style.display =
            "block";


        statusView.textContent =
            "Ракета набирает высоту";


        multiplierView.textContent =
            "1.00x";


        multiplierView.style.color =
            "#ffffff";


        rocket.textContent =
            "🚀";


        rocket.classList.add(
            "flying"
        );


        rocket.style.transform =
            "translate(0px, 0px) rotate(-12deg)";


        previousRocketX =
            20;


        previousRocketY =
            canvasHeight - 30;


        startTime =
            performance.now();


        if (
            animationFrame
        ) {

            cancelAnimationFrame(
                animationFrame
            );

        }


        animationFrame =
            requestAnimationFrame(
                gameLoop
            );

    }


    /* ===================================
       MAIN ANIMATION
    ==================================== */

    function gameLoop(now) {

        if (!gameActive) {
            return;
        }


        /*
            Время игры в секундах
        */

        const elapsed =
            (now - startTime) /
            1000;


        /*
            Коэффициент растёт постепенно.
            Чем дольше полёт,
            тем быстрее рост.
        */

        currentMultiplier =
            1 +
            elapsed * 0.38 +
            elapsed * elapsed * 0.055;


        /*
            Ограничиваем до точки краша
        */

        if (
            currentMultiplier >
            targetCrash
        ) {

            currentMultiplier =
                targetCrash;

        }


        multiplierView.textContent =
            currentMultiplier
                .toFixed(2)
            + "x";


        const potentialWin =
            Math.floor(
                activeBet *
                currentMultiplier
            );


        winPreview.textContent =
            potentialWin;


        /*
        ============================
            ДВИЖЕНИЕ РАКЕТЫ
            ============================

            progress увеличивается
            от 0 примерно к 1.

            X двигается вправо.

            Y сначала медленно,
            потом быстрее вверх.
        */


        const flightProgress =
            Math.min(
                elapsed / 5,
                1
            );


        const maxX =
            canvasWidth - 88;


        const maxY =
            canvasHeight - 88;


        /*
            Горизонтальное движение
        */

        const rocketX =
            20 +
            maxX *
            flightProgress;


        /*
            Вертикальная дуга.

            Math.pow делает
            набор высоты плавным.
        */

        const rocketRise =
            maxY *
            Math.pow(
                flightProgress,
                0.72
            );


        /*
            Небольшое покачивание
        */

        const wave =
            Math.sin(
                elapsed * 5
            ) * 3;


        /*
            transform Y отрицательный,
            поэтому ракета летит ВВЕРХ.
        */

        rocket.style.transform =
            `
            translate(
                ${rocketX - 20}px,
                ${-(rocketRise + wave)}px
            )
            rotate(-15deg)
            `;


        /*
            Текущие координаты
            для следа.
        */

        const drawX =
            rocketX + 17;


        const drawY =
            canvasHeight -
            28 -
            rocketRise -
            wave;


        /*
            Перерисовываем Canvas.
        */

        ctx.clearRect(
            0,
            0,
            canvasWidth,
            canvasHeight
        );


        drawStars();


        /*
            Рисуем красивый
            светящийся след.
        */

        drawTrajectory(
            flightProgress,
            elapsed
        );


        /*
            Яркая точка
            возле двигателя.
        */

        ctx.beginPath();

        ctx.arc(
            drawX - 8,
            drawY + 12,
            3.5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#38bdf8";

        ctx.shadowColor =
            "#9333ea";

        ctx.shadowBlur =
            18;

        ctx.fill();

        ctx.shadowBlur =
            0;


        /*
            Проверяем краш.
        */

        if (
            currentMultiplier >=
            targetCrash
        ) {

            crashGame();

            return;

        }


        animationFrame =
            requestAnimationFrame(
                gameLoop
            );

    }


    /* ===================================
       TRAJECTORY
    ==================================== */

    function drawTrajectory(
        progress,
        elapsed
    ) {

        if (
            progress <= 0
        ) {
            return;
        }


        const startX =
            32;


        const startY =
            canvasHeight - 25;


        const maxX =
            canvasWidth - 88;


        const maxY =
            canvasHeight - 88;


        const endX =
            20 +
            maxX *
            progress;


        const rise =
            maxY *
            Math.pow(
                progress,
                0.72
            );


        const endY =
            canvasHeight -
            28 -
            rise -
            Math.sin(elapsed * 5) * 3;


        /*
            Градиент линии.
        */

        const gradient =
            ctx.createLinearGradient(
                startX,
                startY,
                endX,
                endY
            );


        gradient.addColorStop(
            0,
            "rgba(147,51,234,0.05)"
        );


        gradient.addColorStop(
            0.55,
            "rgba(147,51,234,0.75)"
        );


        gradient.addColorStop(
            1,
            "rgba(56,189,248,1)"
        );


        ctx.beginPath();


        ctx.moveTo(
            startX,
            startY
        );


        /*
            Безье-кривая создаёт
            плавную дугу.
        */

        ctx.quadraticCurveTo(

            startX +
            (endX - startX) *
            0.55,

            startY -
            rise *
            0.20,

            endX,
            endY

        );


        ctx.strokeStyle =
            gradient;


        ctx.lineWidth =
            4;


        ctx.lineCap =
            "round";


        ctx.shadowColor =
            "#9333ea";


        ctx.shadowBlur =
            14;


        ctx.stroke();


        ctx.shadowBlur =
            0;

    }


    /* ===================================
       CASH OUT
    ==================================== */

    function cashOut() {

        if (!gameActive) {
            return;
        }


        const payout =
            Math.floor(
                activeBet *
                currentMultiplier
            );


        userBalance +=
            payout;


        balanceVal.textContent =
            userBalance;


        finishGame(
            true,
            payout
        );

    }


    /* ===================================
       CRASH
    ==================================== */

    function crashGame() {

        finishGame(
            false,
            0
        );

    }


    /* ===================================
       FINISH GAME
    ==================================== */

    function finishGame(
        success,
        reward
    ) {

        if (!gameActive) {
            return;
        }


        gameActive =
            false;


        if (
            animationFrame
        ) {

            cancelAnimationFrame(
                animationFrame
            );

        }


        rocket.classList.remove(
            "flying"
        );


        cashBtn.style.display =
            "none";


        playBtn.style.display =
            "block";


        betField.disabled =
            false;


        addHistory(
            currentMultiplier
        );


        if (success) {

            multiplierView.style.color =
                "#22c55e";


            statusView.textContent =
                Выигрыш +${reward} ⭐;


            rocket.textContent =
                "🌕";

        }

        else {

            multiplierView.style.color =
                "#ef4444";


            statusView.textContent =
                "КРАШ 💥";


            rocket.textContent =
                "💥";

        }


        setTimeout(
            resetGameVisuals,
            2500
        );

    }


    /* ===================================
       RESET
    ==================================== */

    function resetGameVisuals() {

        /*
            Если новая игра уже началась,
            старый таймер ничего
            не должен сбрасывать.
        */

        if (gameActive) {
            return;
        }


        currentMultiplier =
            1;


        multiplierView.textContent =
            "1.00x";


        multiplierView.style.color =
            "#ffffff";


        statusView.textContent =
            "Готов к запуску";


        rocket.textContent =
            "🚀";


        rocket.style.transform =
            "translate(0px, 0px) rotate(-12deg)";


        ctx.clearRect(
            0,
            0,
            canvasWidth,
            canvasHeight
        );


        drawStars();

    }


    /* ===================================
       HISTORY
    ==================================== */

    function addHistory(
        multiplier
    ) {

        let className =
            "low";


        if (
            multiplier >= 2
        ) {

            className =
                "mid";

        }


        if (
            multiplier >= 4
        ) {

            className =
                "high";

        }


        if (
            multiplier >= 8
        ) {

            className =
                "ultra";

        }


        const pill =
            document.createElement(
                "div"
            );


        pill.className =
            history-pill ${className};


        pill.textContent =
            multiplier
                .toFixed(2)
            + "x";


        historyRow.prepend(
            pill
        );


        while (
            historyRow.children.length >
            8
        ) {

            historyRow.lastElementChild
                .remove();

        }

    }


    /* ===================================
       BONUS
    ==================================== */

    function claimBonus() {

        userBalance +=
            200;


        balanceVal.textContent =
            userBalance;


        alert(
            "Вы получили +200 ⭐"
        );

    }


    /* ===================================
       REFERRAL
    ==================================== */

    function shareReferral() {

        alert(
            "Реферальная ссылка будет здесь"
        );

    }


    /* ===================================
       INITIALIZE
    ==================================== */

    resizeCanvas();

    drawStars();


    window.addEventListener(
        "resize",
        () => {

            resizeCanvas();

            ctx.clearRect(
                0,
                0,
                canvasWidth,
                canvasHeight
            );

            drawStars();

        }
    );

</script>

</body>
