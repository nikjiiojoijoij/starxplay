<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarXPlay Ultimate Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-secondary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent-purple: #9333ea;
            --accent-purple-hover: #7e22ce;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            padding-bottom: 80px;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 900;
            font-size: 17px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-balance-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-cyan);
        }

        /* History Multipliers Bar */
        .history-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .history-row::-webkit-scrollbar { display: none; }

        .history-pill {
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            border: 1px solid var(--border-color);
        }
        .history-pill.low { color: #facc15; }
        .history-pill.mid { color: var(--accent-cyan); }
        .history-pill.high { color: var(--accent-purple); }
        .history-pill.ultra { color: var(--accent-green); }

        /* Main Game Arena */
        .arena-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-viewport {
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            height: 250px;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        /* Canvas Background Grid & Stars */
        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .flight-trajectory {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .rocket-object {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 38px;
            transition: transform 0.05s linear;
            will-change: transform;
            filter: drop-shadow(0 0 12px rgba(147, 51, 234, 0.8));
            z-index: 5;
        }

        .center-hud {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }

        .multiplier-display {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            letter-spacing: 1px;
        }

        .status-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* Control Panel Elements */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bet-box {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .bet-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .bet-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 900;
            width: 90px;
            text-align: right;
            outline: none;
        }

        .quick-chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .chip-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 8px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .chip-btn:hover { background: #334155; color: white; }
        .chip-btn:active { transform: scale(0.95); }

        /* Big Action Buttons */
        .btn-core {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }
        .btn-core:active { transform: scale(0.98); }

        .btn-play-action {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #6b21a8 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.5);
        }

        .btn-cash-action {
            background: linear-gradient(135deg, var(--accent-red) 0%, #b91c1c 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            display: none;
        }

        /* Secondary Grid Sections (Bonuses & Referral) */
        .grid-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            }

        .feature-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .feature-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .feature-action-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
        }
        .feature-action-btn.blue { background: #2563eb; }
        .feature-action-btn:active { transform: scale(0.96); }

        /* Bottom Navigation Menu Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .nav-item span.icon { font-size: 18px; }
        .nav-item.active { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Top Header Bar -->
        <div class="top-header">
            <div class="brand"><span>🚀</span> STARXPLAY</div>
            <div class="user-balance-box">
                <span>⭐</span> <span id="balanceVal">1500</span>
            </div>
        </div>

        <!-- History Bar -->
        <div class="history-row" id="historyRow">
            <div class="history-pill low">1.12x</div>
            <div class="history-pill mid">2.34x</div>
            <div class="history-pill high">5.67x</div>
            <div class="history-pill ultra">12.4x</div>
            <div class="history-pill low">1.04x</div>
        </div>

        <!-- Main Game Arena -->
        <div class="arena-card">
            <div class="game-viewport" id="gameViewport">
                <canvas id="gameCanvas"></canvas>
                <div class="rocket-object" id="rocketObj">🚀</div>
                <div class="center-hud">
                    <div class="multiplier-display" id="multiplierView">1.00x</div>
                    <div class="status-label" id="statusView">Готов к запуску</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="control-panel">
                <div class="bet-box">
                    <span class="bet-label">Сумма ставки:</span>
                    <div class="bet-input-wrapper">
                        <input type="number" id="betField" class="bet-input" value="100">
                        <span style="color: var(--text-muted); font-size: 14px;">⭐</span>
                    </div>
                </div>

                <div class="quick-chips">
                    <button class="chip-btn" onclick="modifyBet(10)">+10</button>
                    <button class="chip-btn" onclick="modifyBet(50)">+50</button>
                    <button class="chip-btn" onclick="modifyBet(100)">+100</button>
                    <button class="chip-btn" onclick="modifyBet(500)">+500</button>
                </div>
                <button class="btn-core btn-play-action" id="playBtn" onclick="initiateFlight()">СДЕЛАТЬ СТАВКУ</button>
                <button class="btn-core btn-cash-action" id="cashBtn" onclick="triggerCashout()">ЗАБРАТЬ <span id="winPreview">0</span> ⭐</button>
            </div>
        </div>

        <!-- Feature Cards -->
        <div class="grid-features">
            <div class="feature-card">
                <div class="feature-title">🎁 ЕЖЕДНЕВНЫЙ БОНУС</div>
                <button class="feature-action-btn" onclick="claimDailyBonus()">Забрать</button>
            </div>
            <div class="feature-card">
                <div class="feature-title">👥 РЕФЕРАЛЫ</div>
                <button class="feature-action-btn blue" onclick="shareRefLink()">Пригласить</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active"><span class="icon">🎮</span>Игра</button>
        <button class="nav-item" onclick="alert('Раздел бонусов в разработке')"><span class="icon">🎁</span>Бонусы</button>
        <button class="nav-item" onclick="alert('Реферальная система активна')"><span class="icon">🤝</span>Рефералы</button>
        <button class="nav-item" onclick="alert('Статистика игроков')"><span class="icon">📊</span>Статистика</button>
        <button class="nav-item" onclick="alert('Поддержка 24/7')"><span class="icon">💬</span>Саппорт</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userBalance = 1500;
        let activeBet = 0;
        let currentMultiplier = 1.00;
        let gameLoopTimer = null;
        let gameActive = false;
        let targetCrash = 1.00;

        const balanceView = document.getElementById('balanceVal');
        const multiplierView = document.getElementById('multiplierView');
        const statusView = document.getElementById('statusView');
        const rocketObj = document.getElementById('rocketObj');
        const betField = document.getElementById('betField');
        const playBtn = document.getElementById('playBtn');
        const cashBtn = document.getElementById('cashBtn');
        const winPreview = document.getElementById('winPreview');
        const historyRow = document.getElementById('historyRow');

        // Canvas setup for stars and background trajectory line
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function resizeCanvas() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Initialize star field background
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2,
                alpha: Math.random()
            });
        }

        function drawBackground() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;
        }

        function modifyBet(amount) {
            let current = parseInt(betField.value) || 0;
            betField.value = current + amount;
        }

        function initiateFlight() {
            let betVal = parseInt(betField.value);
            if (isNaN(betVal)  betVal <= 0  betVal > userBalance) {
                alert('Некорректная сумма ставки!');
                return;
            }

            userBalance -= betVal;
            activeBet = betVal;
            balanceView.innerText = userBalance;

            playBtn.style.display = 'none';
            cashBtn.style.display = 'block';

    betField.disabled = true;

            currentMultiplier = 1.00;
            gameActive = true;
            statusView.innerText = "Ракета набирает высоту...";
            targetCrash = parseFloat((Math.random() * 4.5 + 1.1).toFixed(2));

            let progressX = 0;
            let progressY = 0;

            gameLoopTimer = setInterval(() => {
                currentMultiplier += 0.035;
                multiplierView.innerText = currentMultiplier.toFixed(2) + 'x';

                let potentialWin = Math.floor(activeBet * currentMultiplier);
                winPreview.innerText = potentialWin;

                if (progressX < width - 80) progressX += 1.6;
                if (progressY < height - 90) progressY += 1.2;

                rocketObj.style.transform = translate(${progressX}px, -${progressY}px) rotate(22deg);

                // Draw curve trail
                ctx.strokeStyle = 'rgba(147, 51, 234, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(20, height - 20);
                ctx.lineTo(20 + progressX, (height - 20) - progressY);
                ctx.stroke();

                if (currentMultiplier >= targetCrash) {
                    finishGame(false, 0);
                }
            }, 80);
        }

        function triggerCashout() {
            if (!gameActive) return;
            let payout = Math.floor(activeBet * currentMultiplier);
            userBalance += payout;
            balanceView.innerText = userBalance;
            finishGame(true, payout);
        }

        function finishGame(success, reward) {
            clearInterval(gameLoopTimer);
            gameActive = false;
            cashBtn.style.display = 'none';
            playBtn.style.display = 'block';
            betField.disabled = false;

            let pillClass = 'low';
            if (currentMultiplier >= 2) pillClass = 'mid';
            if (currentMultiplier >= 4) pillClass = 'high';
            if (currentMultiplier >= 8) pillClass = 'ultra';

            let newPill = document.createElement('div');
            newPill.className = history-pill ${pillClass};
            newPill.innerText = currentMultiplier.toFixed(2) + 'x';
            historyRow.prepend(newPill);
            if (historyRow.children.length > 8) historyRow.lastChild.remove();

            if (success) {
                statusView.innerText = Успех! +${reward} ⭐;
                multiplierView.style.color = 'var(--accent-green)';
                rocketObj.innerHTML = '🌕';
            } else {
                statusView.innerText = Краш! Ракета улетела 💥;
                multiplierView.style.color = 'var(--accent-red)';
                rocketObj.innerHTML = '💥';
            }

            setTimeout(() => {
                multiplierView.style.color = '#ffffff';
                multiplierView.innerText = '1.00x';
                rocketObj.innerHTML = '🚀';
                rocketObj.style.transform = 'translate(0px, 0px) rotate(0deg)';
                statusView.innerText = "Готов к запуску";
            }, 3000);
        }

        function claimDailyBonus() {
            userBalance += 200;
            balanceView.innerText = userBalance;
            alert('Бонус +200 ⭐ успешно зачислен на баланс!');
        }

        function shareRefLink() {
            alert('Реферальная ссылка скопирована в буфер обмена!');
        }

        // Animation frame loop for background stars
        function renderLoop() {
            drawBackground();
            requestAnimationFrame(renderLoop);
        }
        renderLoop();
    </script>
</body>
</html>
